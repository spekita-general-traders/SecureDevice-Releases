name: Validate public release metadata
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    name: Validate SecureDevice release manifest
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Validate checked-in manifest and corrupt-fixture rejection
        run: |
          node --test scripts/validate-manifest.test.mjs scripts/validate-release-tag.test.mjs scripts/release-flow.test.mjs
          node scripts/release-flow.mjs validate
