name: Validate public release metadata
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    name: Validate SecureDevice release manifest
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Validate checked-in manifest and corrupt-fixture rejection
        run: |
          node --test scripts/validate-manifest.test.mjs scripts/validate-release-tag.test.mjs scripts/release-flow.test.mjs
          node scripts/release-flow.mjs validate
