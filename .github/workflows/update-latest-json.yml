name: Prepare SecureDevice metadata PR
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing published SecureDevice tag (for example v1.0.19)
        required: true
        type: string
      version_code:
        description: Actual Android versionCode verified from this APK
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: securedevice-metadata-preparation
  cancel-in-progress: false
jobs:
  prepare:
    if: github.repository == 'spekita-general-traders/SecureDevice-Releases' && github.ref == 'refs/heads/main' && github.actor == 'spekita' && github.triggering_actor == 'spekita'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Prepare branch and PR only
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          VERSION_CODE: ${{ inputs.version_code }}
          GITHUB_WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: node scripts/release-flow.mjs prepare
